<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story of 东小杏 · 周更四格漫画连载 · 11_sum</title>
  <meta name="description" content="Story of 东小杏：东京大学情报理工学系研究科研究生「东小杏」的本乡校园日常四格漫画，每周持续更新。">
  <link rel="canonical" href="https://elevenvenven.github.io/story-of-dong-xiaoxing.html">
  <meta property="og:title" content="Story of 东小杏 · 周更四格漫画连载">
  <meta property="og:description" content="东京大学本乡校区日常四格漫画，每周更新。从安田讲堂秋季入学式开始，记录研究生生活的小故事。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://elevenvenven.github.io/story-of-dong-xiaoxing.html">
  <meta property="og:image" content="https://elevenvenven.github.io/images/dong-xiaoxing/cover.png">
  <meta name="theme-color" content="#087c75">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>try{if(localStorage.getItem('theme')==='dark-mode')document.documentElement.classList.add('dark-mode')}catch{}</script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f7f5;
      --paper: #ffffff;
      --ink: #102f2c;
      --muted: #536b66;
      --accent: #087c75;
      --ginkgo: #e5a912;
      --ginkgo-soft: #fff7df;
      --utokyo-blue: #1589e6;
      --line: #d8e5e1;
      --wash: #e8f3ef;
      --shadow: 0 12px 32px rgba(16, 47, 44, 0.07);
      --radius: 16px;
      font-family: 'Inter', 'Noto Sans SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
    }
    :root.dark-mode {
      color-scheme: dark;
      --bg: #0d1c20;
      --paper: #142a2e;
      --ink: #f4fbf9;
      --muted: #abc1bd;
      --accent: #72d5c4;
      --ginkgo: #f7c948;
      --ginkgo-soft: #2e2a1d;
      --utokyo-blue: #58b4ff;
      --line: #294449;
      --wash: #1b3739;
      --shadow: 0 14px 36px rgba(0, 8, 10, 0.36);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 92px; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 6%, rgba(247, 201, 72, 0.14), transparent 28rem),
        radial-gradient(circle at 90% 10%, rgba(21, 137, 230, 0.10), transparent 28rem),
        var(--bg);
      color: var(--ink);
      line-height: 1.75;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    :root.dark-mode body {
      background:
        radial-gradient(circle at 10% 6%, rgba(247, 201, 72, 0.08), transparent 28rem),
        radial-gradient(circle at 90% 10%, rgba(88, 180, 255, 0.10), transparent 28rem),
        var(--bg);
    }

    a { color: var(--accent); text-underline-offset: 4px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

    /* Topbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }
    .bar {
      max-width: 1120px;
      margin: 0 auto;
      min-height: 68px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font-size: 1.2rem;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: -0.04em;
      color: var(--accent);
    }
    .bar-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back {
      font-size: 0.9rem;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
    }
    .back:hover { color: var(--accent); }
    .theme-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      padding: 7px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      white-space: nowrap;
      transition: border-color 0.2s, transform 0.15s;
    }
    .theme-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .reading-line {
      height: 3px;
      width: 0;
      background: linear-gradient(90deg, var(--ginkgo), var(--utokyo-blue), var(--accent));
      position: absolute;
      bottom: -1px;
      left: 0;
    }

    /* Main Container */
    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 24px 72px;
    }

    /* Hero */
    .hero {
      padding: 48px 0 32px;
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 28px;
      align-items: center;
    }
    .avatar-ring {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      padding: 6px;
      background: linear-gradient(135deg, var(--ginkgo), var(--utokyo-blue));
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 22px;
      display: block;
      background: #fff7df;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--ginkgo-soft);
      border: 1px solid color-mix(in srgb, var(--ginkgo) 42%, transparent);
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ginkgo);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ginkgo) 26%, transparent);
    }
    h1 {
      margin: 14px 0 8px;
      font-size: clamp(2rem, 4.4vw, 3.1rem);
      line-height: 1.16;
      letter-spacing: -0.03em;
    }
    .subtitle {
      margin: 0 0 12px;
      font-size: 1.04rem;
      color: var(--muted);
      font-weight: 600;
    }
    .quote {
      margin: 0;
      padding: 10px 16px;
      border-left: 3px solid var(--ginkgo);
      background: var(--paper);
      border-radius: 0 10px 10px 0;
      color: var(--muted);
      font-size: 0.94rem;
      display: inline-block;
    }

    /* Control Strip: Episode Picker + View Mode */
    .control-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
    }
    .episode-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .ep-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .ep-pill:hover, .ep-pill.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }
    :root.dark-mode .ep-pill:hover,
    :root.dark-mode .ep-pill.active {
      color: #0b1c1f;
    }
    .ep-pill.upcoming {
      border-style: dashed;
      background: transparent;
      color: var(--muted);
      cursor: default;
      font-weight: 600;
    }
    .view-toggle {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      gap: 3px;
    }
    .view-btn {
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.2s;
    }
    .view-btn.active {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    /* Episode Card */
    .episode-block {
      margin-bottom: 56px;
    }
    .episode-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .ep-number {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .ep-title {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.05rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    .ep-title-sub {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
      margin-left: 10px;
    }
    .ep-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .tag {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--wash);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 600;
    }
    .ep-date {
      font-size: 0.84rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .ep-summary {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 0.98rem;
      max-width: 820px;
    }

    /* Comic Pages Stream (Vertical Reader & Grid Mode) */
    .comic-pages {
      display: flex;
      flex-direction: column;
      gap: 28px;
      align-items: center;
    }
    .comic-pages.grid-mode {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      align-items: start;
      gap: 20px;
    }
    .page-card {
      width: 100%;
      max-width: 760px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .comic-pages.grid-mode .page-card {
      max-width: none;
    }
    .page-card:hover {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    }
    .page-img-btn {
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: #ffffff;
      cursor: zoom-in;
      overflow: hidden;
    }
    .page-img-btn img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.25s ease;
    }
    .page-card:hover .page-img-btn img {
      transform: scale(1.008);
    }
    .page-foot {
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid var(--line);
      background: var(--paper);
    }
    .page-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink);
    }
    .page-caption {
      font-size: 0.83rem;
      color: var(--muted);
    }

    /* Next Episode Banner */
    .next-card {
      margin-top: 24px;
      padding: 24px 26px;
      border-radius: var(--radius);
      border: 1.5px dashed var(--line);
      background: color-mix(in srgb, var(--paper) 75%, transparent);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .next-card h3 {
      margin: 0 0 4px;
      font-size: 1.08rem;
    }
    .next-card p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .next-badge {
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--ginkgo-soft);
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid color-mix(in srgb, var(--ginkgo) 40%, transparent);
    }

    /* Footer */
    .footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .footer a { text-decoration: none; font-weight: 600; }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(8, 16, 19, 0.9);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lb-inner {
      position: relative;
      max-width: min(94vw, 960px);
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .lb-inner img {
      max-width: 100%;
      max-height: calc(92vh - 70px);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }
    .lb-caption {
      color: #eef6f4;
      font-size: 0.92rem;
      text-align: center;
    }
    .lb-close, .lb-nav {
      position: fixed;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(15, 28, 32, 0.78);
      color: #ffffff;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }
    .lb-close:hover, .lb-nav:hover { background: rgba(8, 124, 117, 0.9); }
    .lb-close {
      top: 18px;
      right: 20px;
      width: 44px;
      height: 44px;
      font-size: 1.5rem;
    }
    .lb-nav {
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      font-size: 1.3rem;
    }
    .lb-prev { left: 18px; }
    .lb-next { right: 18px; }

    @media (max-width: 720px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 18px;
        padding-top: 30px;
      }
      .avatar-ring {
        width: 104px;
        height: 104px;
        border-radius: 22px;
      }
      .avatar-ring img { border-radius: 17px; }
      .bar { padding: 10px 16px; }
      .wrap { padding: 0 16px 56px; }
      .control-strip { padding: 14px; }
      .lb-nav { top: auto; bottom: 18px; transform: none; }
      .lb-prev { left: 24px; }
      .lb-next { right: 24px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="bar">
      <a class="brand" href="./">11_sum.</a>
      <div class="bar-actions">
        <a class="back" href="./#projects">← Projects &amp; Study</a>
        <button type="button" class="theme-btn" id="theme-toggle" aria-pressed="false">切换深色</button>
      </div>
    </div>
    <div class="reading-line" id="reading-line" aria-hidden="true"></div>
  </header>

  <main class="wrap">
    <section class="hero" aria-label="Series Introduction">
      <div class="avatar-ring">
        <img id="series-avatar" src="images/dong-xiaoxing/avatar.png" alt="东小杏头像">
      </div>
      <div>
        <div class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span><span id="series-schedule">WEEKLY · 每周更新</span></div>
        <h1 id="series-title">Story of 东小杏</h1>
        <p class="subtitle" id="series-subtitle">東小杏の日常四コマ · 东京大学本乡校区周更连载</p>
        <p class="quote" id="series-quote">「我叫东小杏，是石佚在东大的另一面。叫我小杏就好啦。」</p>
      </div>
    </section>

    <section class="control-strip" aria-label="Episode navigation and view mode">
      <div class="episode-tabs" id="episode-tabs"></div>
      <div class="view-toggle" role="group" aria-label="阅读模式切换">
        <button type="button" class="view-btn active" data-view="scroll">大图连读</button>
        <button type="button" class="view-btn" data-view="grid">并排一览</button>
      </div>
    </section>

    <div id="episodes-container" aria-live="polite"></div>

    <section class="next-card" aria-label="Weekly update notice">
      <div>
        <h3>下周继续更新 · Next Episode Coming Soon</h3>
        <p id="next-hint">EP.02 正在绘制构思中，下周见！</p>
      </div>
      <span class="next-badge">🍂 Weekly Comic</span>
    </section>

    <footer class="footer">
      <span>11_sum · Story of 东小杏（周更四格连载）</span>
      <a href="./#projects">返回 Projects &amp; Study ↗</a>
    </footer>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="漫画大图预览">
    <button type="button" class="lb-close" id="lb-close" aria-label="关闭预览">&times;</button>
    <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="上一页">&#10094;</button>
    <div class="lb-inner">
      <img id="lb-img" src="" alt="">
      <div class="lb-caption" id="lb-caption"></div>
    </div>
    <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="下一页">&#10095;</button>
  </div>

  <script>
    // Theme toggle synced with main site localStorage key ('theme' = 'dark-mode' | 'light-mode')
    const themeBtn = document.getElementById('theme-toggle');
    function syncTheme() {
      const dark = document.documentElement.classList.contains('dark-mode');
      themeBtn.textContent = dark ? '切换浅色' : '切换深色';
      themeBtn.setAttribute('aria-pressed', String(dark));
    }
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark-mode');
      try {
        localStorage.setItem('theme', document.documentElement.classList.contains('dark-mode') ? 'dark-mode' : 'light-mode');
      } catch {}
      syncTheme();
    });
    syncTheme();

    // Reading progress bar
    const readingLine = document.getElementById('reading-line');
    window.addEventListener('scroll', () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const pct = max > 0 ? Math.min(100, Math.max(0, (window.scrollY / max) * 100)) : 100;
      readingLine.style.width = pct + '%';
    }, { passive: true });

    // Lightbox state
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCaption = document.getElementById('lb-caption');
    let flatPages = [];
    let currentIdx = 0;

    function openLightbox(idx) {
      currentIdx = (idx + flatPages.length) % flatPages.length;
      const item = flatPages[currentIdx];
      lbImg.src = item.src;
      lbImg.alt = item.label;
      lbCaption.textContent = `${item.epNumber} ${item.epTitle} · ${item.label}`;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }
    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lb-prev').addEventListener('click', () => openLightbox(currentIdx - 1));
    document.getElementById('lb-next').addEventListener('click', () => openLightbox(currentIdx + 1));
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') openLightbox(currentIdx - 1);
      else if (e.key === 'ArrowRight') openLightbox(currentIdx + 1);
    });

    // View mode toggle
    let currentView = 'scroll';
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentView = btn.dataset.view;
        document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.comic-pages').forEach(el => el.classList.toggle('grid-mode', currentView === 'grid'));
      });
    });

    // Load weekly episodes from JSON
    fetch('dong-xiaoxing-stories.json?v=20261124-ep01')
      .then(r => r.json())
      .then(data => {
        if (data.series) {
          document.getElementById('series-title').textContent = data.series.title;
          document.getElementById('series-subtitle').textContent = data.series.subtitle;
          document.getElementById('series-schedule').textContent = data.series.schedule;
          document.getElementById('series-quote').textContent = data.series.quote;
          if (data.series.avatar) document.getElementById('series-avatar').src = data.series.avatar;
          if (data.series.next_episode_hint) document.getElementById('next-hint').textContent = data.series.next_episode_hint;
        }

        const tabs = document.getElementById('episode-tabs');
        const container = document.getElementById('episodes-container');
        flatPages = [];

        data.episodes.forEach((ep, epIdx) => {
          const pill = document.createElement('a');
          pill.className = 'ep-pill' + (epIdx === 0 ? ' active' : '');
          pill.href = '#' + ep.id;
          pill.textContent = `${ep.number} · ${ep.title}`;
          pill.addEventListener('click', () => {
            document.querySelectorAll('.ep-pill:not(.upcoming)').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
          });
          tabs.appendChild(pill);

          const section = document.createElement('article');
          section.className = 'episode-block';
          section.id = ep.id;

          const tagsHtml = (ep.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
          section.innerHTML = `
            <div class="episode-head">
              <div>
                <span class="ep-number">${ep.number} · ${ep.language || 'Comic'}</span>
                <h2 class="ep-title">${ep.title}${ep.title_zh ? `<span class="ep-title-sub">${ep.title_zh}</span>` : ''}</h2>
              </div>
              <div class="ep-meta">
                ${tagsHtml}
                <time class="ep-date" datetime="${ep.date}">${ep.date}</time>
              </div>
            </div>
            <p class="ep-summary">${ep.summary || ''}</p>
            <div class="comic-pages ${currentView === 'grid' ? 'grid-mode' : ''}"></div>
          `;

          const pagesWrap = section.querySelector('.comic-pages');
          (ep.pages || []).forEach(pg => {
            const globalIdx = flatPages.length;
            flatPages.push({ ...pg, epNumber: ep.number, epTitle: ep.title });

            const fig = document.createElement('figure');
            fig.className = 'page-card';
            fig.style.margin = '0';
            fig.innerHTML = `
              <button type="button" class="page-img-btn" aria-label="点击放大查看 ${pg.label}">
                <img src="${pg.src}" alt="${ep.title} - ${pg.label}" loading="lazy">
              </button>
              <figcaption class="page-foot">
                <span class="page-label">${pg.label}</span>
                <span class="page-caption">${pg.caption || ''}</span>
              </figcaption>
            `;
            fig.querySelector('.page-img-btn').addEventListener('click', () => openLightbox(globalIdx));
            pagesWrap.appendChild(fig);
          });

          container.appendChild(section);
        });

        // Add subtle next-episode pill
        const nextNum = 'EP.' + String(data.episodes.length + 1).padStart(2, '0');
        const up = document.createElement('span');
        up.className = 'ep-pill upcoming';
        up.textContent = `${nextNum} · 下周预告`;
        tabs.appendChild(up);
      })
      .catch(err => {
        document.getElementById('episodes-container').innerHTML =
          '<p style="color:var(--muted)">连载数据加载失败，请刷新重试。</p>';
        console.error(err);
      });
  </script>
</body>
</html>
