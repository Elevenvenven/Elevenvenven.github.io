<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AI Testing 交互实验室</title>
  <desc id="desc">DeepGauge 神经元边界覆盖率与 DeepHunter 覆盖率引导模糊测试交互实验室封面</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#dceae5" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="680" fill="#edf5f1"/>
  <rect width="1200" height="680" fill="url(#grid)"/>
  <!-- Centered safe-zone card so 310x220 object-fit:cover never clips content -->
  <rect x="132" y="54" width="936" height="572" rx="16" fill="#ffffff" stroke="#cbdfd7" stroke-width="2"/>
  <path stroke="#087c75" stroke-width="5" d="M178 112h48"/>
  <text x="240" y="119" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3.5" fill="#087c75">UTOKYO · TRUSTWORTHY AI · INTERACTIVE LAB</text>

  <text x="178" y="218" font-family="'Noto Sans SC','Microsoft YaHei',Inter,sans-serif" font-size="60" font-weight="800" fill="#102f2c">AI Testing 交互实验室</text>
  <text x="180" y="270" font-family="'Noto Sans SC','Microsoft YaHei',Inter,sans-serif" font-size="25" fill="#536b66">DeepGauge 神经元体温计 × DeepHunter 智能考官</text>

  <!-- Visual diagram panel inside x=178..1022 -->
  <rect x="178" y="316" width="844" height="214" rx="12" fill="#f5faf8" stroke="#d4e4df" stroke-width="1.5"/>

  <!-- Left: NBC Neuron Boundary Track -->
  <text x="206" y="354" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#087c75">DEEPGAUGE · NBCov(T)</text>
  <rect x="206" y="378" width="366" height="40" rx="20" fill="#ffffff" stroke="#cbdfd7" stroke-width="1.5"/>
  <rect x="208" y="380" width="76" height="36" rx="18" fill="#ece7fb"/>
  <rect x="290" y="380" width="198" height="36" fill="#e1f3ef"/>
  <rect x="494" y="380" width="76" height="36" rx="18" fill="#fcefd6"/>
  <line x1="290" y1="372" x2="290" y2="424" stroke="#6d54c4" stroke-width="2.5"/>
  <line x1="488" y1="372" x2="488" y2="424" stroke="#c27a0e" stroke-width="2.5"/>
  <circle cx="246" cy="398" r="8.5" fill="#6d54c4"/>
  <circle cx="354" cy="398" r="6.5" fill="#087c75" opacity="0.7"/>
  <circle cx="424" cy="398" r="6.5" fill="#087c75" opacity="0.7"/>
  <circle cx="532" cy="398" r="8.5" fill="#c27a0e"/>
  <text x="246" y="452" text-anchor="middle" font-family="Consolas,monospace" font-size="13.5" font-weight="700" fill="#6d54c4">Lower</text>
  <text x="389" y="452" text-anchor="middle" font-family="Consolas,monospace" font-size="13.5" fill="#536b66">[low_n, high_n]</text>
  <text x="532" y="452" text-anchor="middle" font-family="Consolas,monospace" font-size="13.5" font-weight="700" fill="#c27a0e">Upper</text>
  <text x="206" y="498" font-family="Consolas,monospace" font-size="15" fill="#102f2c">4,694 neurons · LeNet-5</text>

  <!-- Arrow bridge -->
  <path d="M590 400h38" stroke="#087c75" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="635,400 624,392 624,408" fill="#087c75"/>

  <!-- Right: DeepHunter Fuzzing Loop -->
  <text x="654" y="354" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#087c75">DEEPHUNTER · FUZZ LOOP</text>
  <rect x="654" y="378" width="98" height="52" rx="10" fill="#e1f3ef" stroke="#087c75" stroke-width="1.5"/>
  <text x="703" y="401" text-anchor="middle" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#087c75">Queue Q</text>
  <text x="703" y="420" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="12.5" fill="#536b66">题库</text>

  <path d="M752 404h18" stroke="#536b66" stroke-width="2"/>
  <polygon points="776,404 768,399 768,409" fill="#536b66"/>

  <rect x="776" y="378" width="98" height="52" rx="10" fill="#ffffff" stroke="#087c75" stroke-width="1.5"/>
  <text x="825" y="401" text-anchor="middle" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#102f2c">Alg 2</text>
  <text x="825" y="420" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="12.5" fill="#536b66">换马甲</text>

  <path d="M874 404h18" stroke="#536b66" stroke-width="2"/>
  <polygon points="898,404 890,399 890,409" fill="#536b66"/>

  <rect x="898" y="378" width="94" height="52" rx="10" fill="#087c75"/>
  <text x="945" y="401" text-anchor="middle" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#ffffff">DNN</text>
  <text x="945" y="420" text-anchor="middle" font-family="Consolas,monospace" font-size="11.5" fill="#d9f5ef">+NBC / F</text>

  <!-- Feedback arc back to Queue Q -->
  <path d="M945 430v36H703v-30" fill="none" stroke="#087c75" stroke-width="2.2"/>
  <polygon points="703,430 697,440 709,440" fill="#087c75"/>
  <text x="824" y="498" text-anchor="middle" font-family="Consolas,monospace" font-size="13.5" fill="#087c75">isCoverageGain → Q.append(s')</text>

  <!-- Signature inside safe zone -->
  <g transform="translate(906,568)">
    <rect x="0" y="10" width="3.5" height="11" rx="1" fill="#087c75"/>
    <rect x="6" y="0" width="3.5" height="21" rx="1" fill="#087c75"/>
    <rect x="12" y="6" width="3.5" height="15" rx="1" fill="#087c75"/>
    <rect x="18" y="12" width="3.5" height="9" rx="1" fill="#087c75"/>
    <text x="29" y="19" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#102f2c">11_sum</text>
  </g>
</svg>
